          import java.util.concurrent.ConcurrentHashMap

          class ApiError(val code: Int, message: String, val errCode: String = "") : Exception(message)

          class MainActivity : Activity() {

              companion object {
                  const val GROQ = "https://api.groq.com/openai/v1"
                  const val FALLBACK_MODEL = "llama-3.1-8b-instant"
                  val TR: Locale = Locale.forLanguageTag("tr-TR")

                  // Hesapta hangisi varsa bu sirayla en iyisi secilir
                  val PREFERRED = listOf(
                      "llama-3.3-70b-versatile",
                      "openai/gpt-oss-120b",
                      "openai/gpt-oss-20b",
                      "meta-llama/llama-4-maverick-17b-128e-instruct",
                      "meta-llama/llama-4-scout-17b-16e-instruct",
                      "moonshotai/kimi-k2-instruct",
                      "qwen/qwen3-32b",
                      "llama-3.1-8b-instant",
                      "gemma2-9b-it"
                  )

                  const val DEFAULT_PERSONA =
                      "Sen Novax'sın, Türkçe konuşan zeki ve samimi bir yapay zeka asistanısın. " +
                      "Kısa, net ve doğal cevap ver. Cevapların sesli okunabilir, o yüzden emoji ve gereksiz uzun listelerden kaçın."

                  const val CAPS =
                      " Telefon komutlarını (uygulama açma, fener, alarm, zamanlayıcı, ses seviyesi, YouTube ve Google araması, " +
                      "numara çevirme, saat, pil) uygulama senin yerine yerel olarak yapar; bunları sen yaptığını iddia etme, " +
                      "kullanıcı yanlış söylediyse nasıl söylemesi gerektiğini kısaca hatırlat. " +
                      "Mesaj gönderme gibi diğer telefon işlemleri henüz yok, istenirse dürüstçe söyle."
              }

              private lateinit var web: WebView
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var recognizer: SpeechRecognizer? = null

              @Volatile private var cancel = false
              @Volatile private var activeConn: HttpURLConnection? = null
              @Volatile private var autoModel: String? = null
              private val bad: MutableSet<String> = ConcurrentHashMap.newKeySet()
              private var torchOn = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#06090f")
                  window.navigationBarColor = Color.parseColor("#06090f")

                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#06090f"))
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webChromeClient = WebChromeClient()
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")

                  initTts()
              }

              override fun onResume() {
                  super.onResume()
                  js("typeof onServiceState==='function'&&onServiceState(${NovaxService.running})")
              }

              override fun onDestroy() {
                  recognizer?.destroy()
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  moveTaskToBack(true)
              }

              private fun js(code: String) {
                  runOnUiThread { web.evaluateJavascript(code, null) }
              }

              private fun prefs() = getSharedPreferences("novax", MODE_PRIVATE)
              private fun p(k: String, d: String = ""): String = prefs().getString(k, d) ?: d

              private fun launch(i: Intent) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  runOnUiThread {
                      try {
                          startActivity(i)
                      } catch (e: Exception) {
                          js("toast('Açılamadı')")
                      }
                  }
              }

              // ---------- TTS ----------
              private fun initTts() {
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          val r = tts?.setLanguage(TR)
                          ttsReady = true
                          if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              js("toast('Türkçe ses verisi yok, telefon ayarlarından indir')")
                          }
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) { js("onTts('start')") }
                              override fun onDone(utteranceId: String?) { js("onTts('done')") }
                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) { js("onTts('done')") }
                          })
                      }
                  }
              }

              private fun speakNow(text: String) {
                  if (!ttsReady) {
                      js("toast('Ses motoru hazır değil')")
                      js("onTts('done')")
                      return
                  }
                  tts?.setLanguage(Locale.forLanguageTag(p("lang", "tr-TR")))
                  tts?.setSpeechRate(p("rate", "1.0").toFloatOrNull() ?: 1f)
                  tts?.setPitch(p("pitch", "1.0").toFloatOrNull() ?: 1f)
                  val t = if (text.length > 3500) text.take(3500) else text
                  tts?.speak(t, TextToSpeech.QUEUE_FLUSH, null, "novax")
              }

              // ---------- Speech recognition ----------
              private fun beginListening() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      js("onListenError('Konuşma tanıma servisi bulunamadı')")
                      return
                  }
                  tts?.stop()
                  recognizer?.destroy()
                  val rec = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = rec
                  rec.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) { js("onListenState('listening')") }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) { js("onLevel($rmsdB)") }
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() { js("onListenState('processing')") }
                      override fun onError(error: Int) {
                          js("onListenError(${JSONObject.quote(errorText(error))})")
                      }
                      override fun onResults(results: Bundle?) {
                          val t = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull() ?: ""
                          js("onVoiceResult(${JSONObject.quote(t)})")
                      }
                      override fun onPartialResults(partialResults: Bundle?) {
                          val t = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull() ?: ""
                          if (t.isNotEmpty()) js("onPartial(${JSONObject.quote(t)})")
                      }
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, p("lang", "tr-TR"))
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  }
                  rec.startListening(intent)
              }

              private fun errorText(code: Int): String = when (code) {
                  SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> "Seni duyamadım, tekrar dene"
                  SpeechRecognizer.ERROR_NETWORK, SpeechRecognizer.ERROR_NETWORK_TIMEOUT -> "Ses tanıma için internet gerekli"
                  SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> "Mikrofon izni gerekli"
                  SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> "Ses tanıma meşgul, tekrar dene"
                  SpeechRecognizer.ERROR_AUDIO -> "Mikrofon hatası"
                  else -> "Ses tanıma hatası ($code)"
              }

              // ---------- AI (Groq veya yerel OpenAI uyumlu sunucu) ----------
              private fun isLocal() = p("provider", "groq") == "local"
              private fun baseUrl() = if (isLocal()) p("local_url", "http://127.0.0.1:11434/v1").trimEnd('/') else GROQ
              private fun apiKey() = if (isLocal()) p("local_key") else p("groq_key")

              private fun isChatModel(id: String): Boolean {
                  val l = id.lowercase()
                  return listOf("whisper", "guard", "tts", "orpheus", "playai", "embed", "safeguard").none { l.contains(it) }
              }

              private fun pickModel(ids: List<String>): String? {
                  val ok = ids.filter { isChatModel(it) && it !in bad }
                  return PREFERRED.firstOrNull { it in ok } ?: ok.firstOrNull()
              }

              private fun groqModel(key: String): String {
                  val pref = p("model", "auto")
                  if (pref.isNotBlank() && pref != "auto" && pref !in bad) return pref
                  autoModel?.let { if (it !in bad) return it }
                  val m = pickModel(fetchModels(GROQ, key)) ?: FALLBACK_MODEL
                  autoModel = m
                  return m
              }

              private fun isModelErr(e: ApiError): Boolean {
                  val m = (e.message ?: "").lowercase()
                  return e.errCode in listOf("model_not_found", "model_decommissioned", "model_terms_required") ||
                      e.code == 404 ||
                      (e.code in listOf(400, 403) && m.contains("model"))
              }

              private fun apiError(code: Int, text: String): ApiError {
                  var msg = "Sunucu hatası (HTTP $code)"
                  var ec = ""
                  try {
                      val er = JSONObject(text).opt("error")
                      if (er is JSONObject) {
                          msg = er.optString("message", msg)
                          ec = er.optString("code", "")
                      } else if (er is String && er.isNotBlank()) {
                          msg = er
                      }
                  } catch (e: Exception) {
                  }
                  return ApiError(code, msg, ec)
              }

              private fun friendlyEx(e: Exception): String = when (e) {
                  is UnknownHostException -> "Sunucuya ulaşılamadı. İnternet bağlantını veya adresi kontrol et."
                  is ConnectException -> "Sunucuya bağlanılamadı. Adres doğru mu, sunucu çalışıyor mu?"
                  is SocketTimeoutException -> "Sunucu zaman aşımına uğradı."
                  is ApiError -> when {
                      e.code == 401 -> "API anahtarı geçersiz. Ayarlardan kontrol et."
                      e.code == 429 -> "İstek limiti doldu, biraz bekleyip tekrar dene."
                      else -> e.message ?: "Hata (HTTP ${e.code})"
                  }
                  else -> e.message ?: "Bilinmeyen hata"
              }

              private fun fetchModels(base: String, key: String): List<String> {
                  val c = URL("$base/models").openConnection() as HttpURLConnection
                  c.connectTimeout = 10000
                  c.readTimeout = 15000
                  if (key.isNotBlank()) c.setRequestProperty("Authorization", "Bearer $key")
                  val code = c.responseCode
                  val text = (if (code in 200..299) c.inputStream else c.errorStream)
                      ?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                  c.disconnect()
                  if (code !in 200..299) throw apiError(code, text)
                  val arr = JSONObject(text).getJSONArray("data")
                  return (0 until arr.length()).map { arr.getJSONObject(it).getString("id") }
              }

              private fun systemPrompt(): String {
                  val persona = p("persona").ifBlank { DEFAULT_PERSONA }
                  val about = p("about")
                  val now = SimpleDateFormat("d MMMM yyyy EEEE HH:mm", TR).format(Date())
                  val en = if (p("lang", "tr-TR") == "en-US") " Kullanıcı İngilizce konuşuyor, İngilizce cevap ver." else ""
                  return persona + en + " Şu anki tarih ve saat: $now." +
                      (if (about.isNotBlank()) " Kullanıcı hakkında bilgi: $about." else "") + CAPS
              }

              private fun streamChat(id: Int, base: String, key: String, model: String, messages: JSONArray): String {
                  val c = URL("$base/chat/completions").openConnection() as HttpURLConnection
                  activeConn = c
                  c.requestMethod = "POST"
                  c.connectTimeout = 15000
                  c.readTimeout = 90000
                  if (key.isNotBlank()) c.setRequestProperty("Authorization", "Bearer $key")
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("Accept", "text/event-stream")
                  c.doOutput = true
                  val body = JSONObject()
                      .put("model", model)
                      .put("messages", messages)
                      .put("temperature", (p("temp", "0.7").toDoubleOrNull() ?: 0.7))
                      .put("max_tokens", 1500)
                      .put("stream", true)
                  c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = c.responseCode
                  if (code !in 200..299) {
                      val text = c.errorStream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                      c.disconnect()
                      throw apiError(code, text)
                  }
                  val sb = StringBuilder()
                  try {
                      c.inputStream.bufferedReader(Charsets.UTF_8).use { r ->
                          while (!cancel) {
                              val line = r.readLine() ?: break
                              if (!line.startsWith("data:")) continue
                              val d = line.substring(5).trim()
                              if (d == "[DONE]") break
                              if (d.isEmpty()) continue
                              try {
                                  val delta = JSONObject(d).getJSONArray("choices").optJSONObject(0)?.optJSONObject("delta")
                                  if (delta != null && !delta.isNull("content")) {
                                      val piece = delta.getString("content")
                                      if (piece.isNotEmpty()) {
                                          sb.append(piece)
                                          js("onToken($id,${JSONObject.quote(piece)})")
                                      }
                                  }
                              } catch (e: Exception) {
                              }
                          }
                      }
                  } catch (e: java.io.IOException) {
                      if (!cancel && sb.isEmpty()) throw e
                  } finally {
                      val cc = c
                      Thread { try { cc.disconnect() } catch (e: Exception) {} }.start()
                  }
                  return sb.toString()
              }

              // ---------- Telefon komutlari ----------
              private fun runCommand(raw: String): String {
                  val t = raw.lowercase(TR).trim().trimEnd('.', '!', '?')
                  fun has(vararg k: String) = k.any { t.contains(it) }
                  try {
                      if (has("saat kaç", "saati söyle")) {
                          return "Saat " + SimpleDateFormat("HH:mm", TR).format(Date()) + "."
                      }
                      if (has("bugün ayın kaçı", "bugünün tarihi", "bugün günlerden ne", "tarih ne")) {
                          return SimpleDateFormat("d MMMM yyyy, EEEE", TR).format(Date()) + "."
                      }
                      if (has("pil") && has("kaç", "yüzde", "durum", "seviye")) {
                          val bm = getSystemService(BATTERY_SERVICE) as BatteryManager
                          val lvl = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                          return "Pil yüzde $lvl." + (if (bm.isCharging) " Şarj oluyor." else "")
                      }
                      if (has("fener") && has("aç", "yak", "kapat", "söndür")) {
                          val on = !has("kapat", "söndür")
                          val cm = getSystemService(CAMERA_SERVICE) as CameraManager
                          val id = cm.cameraIdList.firstOrNull {
                              cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                          } ?: return "Bu cihazda fener bulunamadı."
                          cm.setTorchMode(id, on)
                          torchOn = on
                          return if (on) "Fener açıldı." else "Fener kapatıldı."
                      }
                      if (has("sesi ", "ses seviyesi")) {
                          val am = getSystemService(AUDIO_SERVICE) as AudioManager
                          if (has("arttır", "artır", "yükselt", "aç", "fazla")) {
                              for (i in 0 until 3) am.adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE,
                                  if (i == 2) AudioManager.FLAG_SHOW_UI else 0
                              )
                              return "Ses yükseltildi."
                          }
                          if (has("kıs", "azalt", "düşür", "alçalt")) {
                              for (i in 0 until 3) am.adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER,
                                  if (i == 2) AudioManager.FLAG_SHOW_UI else 0
                              )
                              return "Ses kısıldı."
                          }
                      }
                      if (has("zamanlayıcı", "sayaç", "geri sayım")) {
                          Regex("(\\d+)\\s*(saniye|dakika|dk|saat)").find(t)?.let { m ->
                              val n = m.groupValues[1].toInt()
                              val unit = m.groupValues[2]
                              val sec = when (unit) { "saniye" -> n; "saat" -> n * 3600; else -> n * 60 }
                              launch(
                                  Intent(AlarmClock.ACTION_SET_TIMER)
                                      .putExtra(AlarmClock.EXTRA_LENGTH, sec)
                                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                              )
                              return "$n $unit için zamanlayıcı kuruldu."
                          }
                      }
                      if (has("alarm") && has("kur", "ayarla")) {
                          Regex("(\\d{1,2})[:.](\\d{2})").find(t)?.let { m ->
                              val h = m.groupValues[1].toInt()
                              val mi = m.groupValues[2].toInt()
                              launch(
                                  Intent(AlarmClock.ACTION_SET_ALARM)
                                      .putExtra(AlarmClock.EXTRA_HOUR, h)
                                      .putExtra(AlarmClock.EXTRA_MINUTES, mi)
                                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                              )
                              return "Alarm %02d:%02d için kuruldu.".format(h, mi)
                          }
                      }
                      Regex("youtube(?:'?da|'?de)?\\s+(.+?)\\s+(?:ara|oynat|izle)$").find(t)?.let { m ->
                          val q = m.groupValues[1]
                          launch(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(q))))
                          return "YouTube'da \"$q\" aranıyor."
                      }
                      if (has("google", "internette", "internet'te", "araştır")) {
                          val q = t.replace(Regex("google(?:'?da|'?de)?|internette|internet'te|\\b(?:ara|araştır)\\b"), "")
                              .replace(Regex("\\s+"), " ").trim()
                          if (q.isNotBlank()) {
                              launch(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=" + Uri.encode(q))))
                              return "\"$q\" için arama açıldı."
                          }
                      }
                      if (has(" ara", "çevir")) {
                          Regex("(\\+?\\d[\\d\\s]{6,}\\d)").find(t)?.let { m ->
                              val num = m.groupValues[1].replace(" ", "")
                              launch(Intent(Intent.ACTION_DIAL, Uri.parse("tel:$num")))
                              return "Arama ekranı açıldı: $num"
                          }
                      }
                      Regex("^(.+?)\\s+(?:aç|açar mısın|başlat|çalıştır)$").find(t)?.let { m ->
                          val name = m.groupValues[1]
                              .replace(Regex("['’][^\\s]*$"), "")
                              .replace(" uygulamasını", "")
                              .trim()
                          if (name.isNotBlank()) {
                              val pm = packageManager
                              val li = pm.queryIntentActivities(
                                  Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                              )
                              val best = li.map { it to it.loadLabel(pm).toString() }
                                  .filter { (_, l) ->
                                      val ll = l.lowercase(TR)
                                      ll.length >= 3 && (name.contains(ll) || ll.contains(name))
                                  }
                                  .minByOrNull { (_, l) -> kotlin.math.abs(l.length - name.length) }
                              if (best != null) {
                                  val li2 = pm.getLaunchIntentForPackage(best.first.activityInfo.packageName)
                                  if (li2 != null) {
                                      launch(li2)
                                      return "${best.second} açılıyor."
                                  }
                              }
                              if (name.split(" ").size <= 2) return "\"$name\" adında bir uygulama bulamadım."
                          }
                      }
                  } catch (e: Exception) {
                      return "Komut çalışmadı: ${e.message}"
                  }
                  return ""
              }

              // ---------- Service / permissions ----------
              private fun startNovax() {
                  val needed = mutableListOf<String>()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      needed.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      needed.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  if (needed.isNotEmpty()) {
                      requestPermissions(needed.toTypedArray(), 100)
                      return
                  }
                  launchService()
              }

              private fun launchService() {
                  ContextCompat.startForegroundService(this, Intent(this, NovaxService::class.java))
                  web.postDelayed({ js("onServiceState(${NovaxService.running})") }, 700)
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  val micOk = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  when (requestCode) {
                      100 -> if (micOk) launchService() else js("toast('Mikrofon izni gerekli')")
                      101 -> if (micOk) beginListening() else js("onListenError('Mikrofon izni gerekli')")
                  }
              }

              private fun askBatteryExemption() {
                  try {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (pm.isIgnoringBatteryOptimizations(packageName)) {
                          js("toast('Pil kısıtlaması zaten kapalı')")
                          return
                      }
                      startActivity(
                          Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$packageName")
                          }
                      )
                  } catch (e: Exception) {
                      js("toast('Ayar açılamadı')")
                  }
              }

              // ---------- JS bridge ----------
              inner class Bridge {
                  @JavascriptInterface
                  fun getPref(k: String, d: String): String = p(k, d)

                  @JavascriptInterface
                  fun setPref(k: String, v: String) {
                      prefs().edit().putString(k, v.trim()).apply()
                      if (k == "model" || k == "provider") {
                          autoModel = null
                          bad.clear()
                      }
                  }

                  @JavascriptInterface
                  fun ready(): Boolean = isLocal() || p("groq_key").isNotBlank()

                  @JavascriptInterface
                  fun modelName(): String =
                      if (isLocal()) "Yerel · " + p("local_model", "llama3.2")
                      else "Groq · " + (autoModel ?: p("model", "auto"))

                  @JavascriptInterface
                  fun command(text: String): String = runCommand(text)

                  @JavascriptInterface
                  fun chat(id: Int, historyJson: String) {
                      cancel = false
                      Thread {
                          try {
                              val local = isLocal()
                              val base = baseUrl()
                              val key = apiKey()
                              val hist = JSONArray(historyJson)
                              val msgs = JSONArray()
                              msgs.put(JSONObject().put("role", "system").put("content", systemPrompt()))
                              for (i in 0 until hist.length()) msgs.put(hist.getJSONObject(i))

                              var model = if (local) p("local_model", "llama3.2") else groqModel(key)
                              var tries = 0
                              var reply: String
                              while (true) {
                                  try {
                                      reply = streamChat(id, base, key, model, msgs)
                                      break
                                  } catch (e: ApiError) {
                                      // Model yok / erisim yok: kotu listesine ekle, hesaptaki bir sonraki modeli sec
                                      if (!local && tries < 3 && isModelErr(e)) {
                                          tries++
                                          bad.add(model)
                                          autoModel = null
                                          val next = groqModel(key)
                                          if (next == model) throw e
                                          model = next
                                          js("onModelChanged(${JSONObject.quote(model)})")
                                      } else {
                                          throw e
                                      }
                                  }
                              }
                              js("onChatResult($id,true,${JSONObject.quote(reply)})")
                          } catch (e: Exception) {
                              js("onChatResult($id,false,${JSONObject.quote(friendlyEx(e))})")
                          }
                      }.start()
                  }

                  @JavascriptInterface
                  fun stopGen() {
                      cancel = true
                      val c = activeConn
                      Thread { try { c?.disconnect() } catch (e: Exception) {} }.start()
                  }

                  @JavascriptInterface
                  fun listModels() {
                      Thread {
                          try {
                              var ids = fetchModels(baseUrl(), apiKey())
                              if (!isLocal()) ids = ids.filter { isChatModel(it) }
                              js("onModels(${JSONObject.quote(JSONArray(ids).toString())},\"\")")
                          } catch (e: Exception) {
                              js("onModels(\"[]\",${JSONObject.quote(friendlyEx(e))})")
                          }
                      }.start()
                  }

                  @JavascriptInterface
                  fun copy(text: String) {
                      runOnUiThread {
                          val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("novax", text))
                          js("toast('Kopyalandı')")
                      }
                  }

                  @JavascriptInterface
                  fun share(text: String) {
                      val send = Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, text)
                      launch(Intent.createChooser(send, "Paylaş"))
                  }

                  @JavascriptInterface
                  fun speak(text: String) { runOnUiThread { speakNow(text) } }

                  @JavascriptInterface
                  fun stopSpeaking() { runOnUiThread { tts?.stop() } }

                  @JavascriptInterface
                  fun listen() { runOnUiThread { beginListening() } }

                  @JavascriptInterface
                  fun stopListen() { runOnUiThread { recognizer?.stopListening() } }

                  @JavascriptInterface
                  fun toggleService() {
                      runOnUiThread {
                          if (NovaxService.running) {
                              stopService(Intent(this@MainActivity, NovaxService::class.java))
                              web.postDelayed({ js("onServiceState(${NovaxService.running})") }, 500)
                          } else {
                              startNovax()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun isServiceRunning(): Boolean = NovaxService.running

                  @JavascriptInterface
                  fun battery() { runOnUiThread { askBatteryExemption() } }
              }
          }
          EOF
          mkdir -p app/src/main/java/com/novax/app
          cat > app/src/main/java/com/novax/app/NovaxService.kt <<'EOF'
          package com.novax.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat

          class NovaxService : Service() {

              companion object {
                  const val CHANNEL_ID = "novax_service"
                  const val NOTIF_ID = 1
                  const val ACTION_STOP = "com.novax.app.STOP"

                  @Volatile
                  var running = false
              }

              private var wakeLock: PowerManager.WakeLock? = null

              override fun onCreate() {
                  super.onCreate()
                  val channel = NotificationChannel(
                      CHANNEL_ID, "Novax arka plan", NotificationManager.IMPORTANCE_LOW
                  )
                  getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  try {
                      ServiceCompat.startForeground(
                          this, NOTIF_ID, buildNotification(),
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      )
                  } catch (e: Exception) {
                      // Izin yoksa veya arka plandan baslatildiysa Android reddeder
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  if (wakeLock == null) {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "novax:service").apply {
                          acquire()
                      }
                  }

                  running = true
                  // Sonraki asamalarda: wake word, ses, Groq burada baslayacak
                  return START_STICKY
              }

              private fun buildNotification(): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val stop = PendingIntent.getService(
                      this, 1,
                      Intent(this, NovaxService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Novax çalışıyor")
                      .setContentText("Arka planda aktif")
                      .setContentIntent(open)
                      .addAction(0, "Durdur", stop)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()
              }

              override fun onDestroy() {
                  running = false
                  wakeLock?.let { if (it.isHeld) it.release() }
                  wakeLock = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF
